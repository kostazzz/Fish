<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<title>Клёв</title>
<style>
:root {
  color-scheme: dark light;
  --bg: #000000;
  --surface: #111111;
  --line: #222222;
  --fg: #ffffff;
  --fg-dim: #777777;
  --bar-low: #222222;
  --bar-mid: #1e4a28;
  --bar-high: #27a844;
  --bad: #b36b6b;
  --input-bg: #0a0a0a;
  --overlay: rgba(0,0,0,0.85);
  --btn-on-text: #000000;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f9f9f9;
    --surface: #ffffff;
    --line: #e0e0e0;
    --fg: #111111;
    --fg-dim: #666666;
    --bar-low: #e0e0e0;
    --bar-mid: #a0d8a0;
    --bar-high: #2e7d32;
    --bad: #d32f2f;
    --input-bg: #f0f0f0;
    --overlay: rgba(0,0,0,0.5);
    --btn-on-text: #ffffff;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 16px; 
  font-weight: 700; /* Изменено с 400 на 500 */
  line-height: 1.35;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
body {
  max-width: 480px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
}

/* HEADER */
.header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; color: var(--fg-dim); font-size: 14px;
}
.h-left { display: flex; gap: 12px; align-items: center; }
.h-left b { color: var(--fg); font-weight: 500; } /* Изменено на 500 */
.info-btn {
  background: none; border: 1px solid var(--line); color: var(--fg-dim);
  width: 24px; height: 24px; border-radius: 50%; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-style: italic;
  font-weight: 500;
}

/* HERO */
.hero { margin-bottom: 40px; }
.hero-title { font-size: 32px; color: var(--bar-high); letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
.hero-title.dim { color: var(--fg); }
.hero-title.bad { color: var(--bad); }
.hero-time { font-size: 18px; color: var(--fg-dim); }

/* TARGETS */
.targets { display: flex; flex-direction: column; gap: 12px; margin-bottom: 48px; }
.target-item { font-size: 20px; color: var(--fg); }

/* GRAPH */
.graph-section { margin-bottom: 24px; }
.graph-container { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin-bottom: 8px; }
.graph-bar { flex: 1; }
.graph-bar.low { background: var(--bar-low); height: 20%; }
.graph-bar.mid { background: var(--bar-mid); height: 50%; }
.graph-bar.high { background: var(--bar-high); height: 100%; }
.graph-bar.now { background: var(--fg); }
.graph-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); }
.graph-labels span { width: 25%; text-align: center; }
.graph-labels span:first-child { text-align: left; }
.graph-labels span:last-child { text-align: right; }

/* DIARY TRIGGER */
.diary-trigger {
  width: 100%; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg); font-family: inherit; font-size: 16px;
  cursor: pointer; margin-top: 10px; transition: background 0.1s;
}
.diary-trigger:active { background: var(--input-bg); }

/* MODALS */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--overlay); display: none;
  align-items: flex-end; justify-content: center; 
  padding: 0; z-index: 100;
}
.modal-overlay.active { display: flex; }

.modal-content {
  background: var(--surface); 
  border: 1px solid var(--line); border-bottom: none;
  border-radius: 12px 12px 0 0; 
  padding: 24px;
  width: 100%; max-width: 480px; 
  max-height: 90vh; overflow-y: auto;
  font-size: 14px; color: var(--fg-dim); line-height: 1.5;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
.modal-content h3 { color: var(--fg); font-size: 18px; margin-bottom: 20px; }

@media (min-width: 500px) {
  .modal-overlay { align-items: center; padding: 20px; }
  .modal-content {
    border-bottom: 1px solid var(--line);
    border-radius: 12px;
    padding-bottom: 24px;
  }
}

.close-btn {
  background: none; border: 1px solid var(--line); color: var(--fg);
  padding: 14px; border-radius: 4px; margin-top: 20px;
  cursor: pointer; width: 100%; font-family: inherit; font-size: 16px;
}

/* DIARY FORM */
.d-row { margin-bottom: 18px; }
.d-row label { display: block; font-size: 13px; color: var(--fg-dim); margin-bottom: 8px; }
.d-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.d-buttons button {
  flex: 1; min-width: 60px; padding: 12px 4px;
  background: var(--input-bg); border: 1px solid var(--line);
  border-radius: 4px; color: var(--fg-dim); font-family: inherit;
  font-size: 14px; cursor: pointer; transition: all 0.1s;
}
.d-buttons button.on { 
  background: var(--bar-high); 
  color: var(--btn-on-text); 
  border-color: var(--bar-high); 
  font-weight: 700; /* Оставил 700 для контраста */
}
.d-input-row { display: flex; gap: 12px; }
.d-input-row > div { flex: 1; }
.d-input-row input {
  width: 100%; padding: 14px; background: var(--input-bg);
  border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg); font-family: inherit; font-size: 18px; text-align: center;
}
.d-input-row input:focus { outline: none; border-color: var(--fg); }
.d-gps {
  width: 100%; padding: 14px; background: var(--input-bg);
  border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg); font-family: inherit; font-size: 15px; cursor: pointer;
}
.d-gps.ok { color: var(--bar-high); border-color: var(--bar-high); }
.d-actions { display: flex; gap: 10px; margin-top: 24px; }
.d-save, .d-cancel {
  flex: 1; padding: 16px; border-radius: 4px;
  font-family: inherit; font-size: 16px; cursor: pointer; border: 1px solid var(--line);
}
.d-save { background: var(--bar-high); color: var(--btn-on-text); border-color: var(--bar-high); font-weight: 700; }
.d-cancel { background: none; color: var(--fg-dim); }

/* EXPORT */
.d-export { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
.d-export button {
  width: 100%; padding: 14px; background: none; border: 1px dashed var(--fg-dim);
  border-radius: 4px; color: var(--fg); font-family: inherit; font-size: 14px; cursor: pointer;
}
</style>
</head>
<body>

<header class="header">
  <div class="h-left">
    <span id="h-date">--.--</span>
    <span id="h-wx">☁️ --°</span>
    <span id="h-wind">➔ -- м/с <span style="font-size:13px" id="h-gust">+--</span></span>
  </div>
  <button class="info-btn" onclick="toggleModal('infoModal')">i</button>
</header>

<main id="app">
  <div class="hero-title dim">ЗАГРУЗКА...</div>
</main>

<div class="modal-overlay" id="infoModal" onclick="if(event.target === this) toggleModal('infoModal')">
  <div class="modal-content">
    <h3>Данные</h3>
    <p>Погода: Open-Meteo. Температура воды не измеряется.</p>
    <p>Высокий зеленый — жор. Средний — слабый клёв. Низкий — глухо.</p>
    <div id="legal-info" style="color: var(--bad); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);"></div>
    <button class="close-btn" onclick="toggleModal('infoModal')">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="diaryModal" onclick="if(event.target === this) closeDiary()">
  <div class="modal-content">
    <h3>Новая запись</h3>
    <div style="font-size: 13px; color: var(--fg-dim); margin-bottom: 24px; padding-bottom: 12px; border-top: 1px solid var(--line);">
      Автозаполнение: <span id="d-auto" style="color: var(--fg);">...</span>
    </div>

    <div class="d-row">
      <label>Цель / Улов</label>
      <div class="d-buttons" data-group="fish">
        <button onclick="pickBtn(this, 'fish', 'Щука')">Щука</button>
        <button onclick="pickBtn(this, 'fish', 'Окунь')">Окунь</button>
        <button onclick="pickBtn(this, 'fish', 'Плотва')">Плотва</button>
        <button onclick="pickBtn(this, 'fish', 'Голавль')">Голавль</button>
        <button onclick="pickBtn(this, 'fish', 'Хариус')">Хариус</button>
      </div>
    </div>

    <div class="d-row">
      <label>Сколько поймал?</label>
      <div class="d-buttons" data-group="catch">
        <button onclick="pickBtn(this, 'catch', '0')">0 (пусто)</button>
        <button onclick="pickBtn(this, 'catch', '1')">1</button>
        <button onclick="pickBtn(this, 'catch', '2')">2</button>
        <button onclick="pickBtn(this, 'catch', '3+')">3+</button>
      </div>
    </div>

    <div class="d-row">
      <label>Прозрачность воды</label>
      <div class="d-buttons" data-group="clarity">
        <button onclick="pickBtn(this, 'clarity', 'чистая')">Чистая</button>
        <button onclick="pickBtn(this, 'clarity', 'мутная')">Мутная</button>
        <button onclick="pickBtn(this, 'clarity', 'кофе')">Кофе</button>
      </div>
    </div>

    <div class="d-row">
      <label>Уровень воды</label>
      <div class="d-buttons" data-group="level">
        <button onclick="pickBtn(this, 'level', 'высокий')">Высокий</button>
        <button onclick="pickBtn(this, 'level', 'норма')">Норма</button>
        <button onclick="pickBtn(this, 'level', 'низкий')">Низкий</button>
      </div>
    </div>

    <div class="d-row">
      <label>Температура воды (°C) и Глубина (м)</label>
      <div class="d-input-row">
        <div><input type="number" step="0.1" id="d-water" placeholder="Вода"></div>
        <div><input type="number" step="0.5" id="d-depth" placeholder="Глуб."></div>
      </div>
    </div>

    <div class="d-row">
      <button class="d-gps" onclick="getGPS()" id="d-gps-btn">📍 Запомнить точку</button>
    </div>

    <div class="d-actions">
      <button class="d-save" onclick="saveEntry()">Сохранить</button>
      <button class="d-cancel" onclick="closeDiary()">Отмена</button>
    </div>

    <div class="d-export">
      <button onclick="exportCSV()" id="d-export-btn">↓ Экспорт CSV (0)</button>
    </div>
  </div>
</div>

<script>
'use strict';

const TZ = 'Europe/Vilnius';
const LAT = 54.98;
const LON = 25.77;

const RULES = {
  pike: { name: 'Щука', start: '02-01', end: '04-30' },
  grayling: { name: 'Хариус', start: '03-01', end: '05-15' },
  asp: { name: 'Жерех', start: '04-01', end: '05-15' },
  zander: { name: 'Судак', start: '03-01', end: '05-31' }
};

let diaryState = {
  fish: null, catch: '0', clarity: null, level: null, coords: null, context: null
};

function toggleModal(id) {
  document.getElementById(id).classList.toggle('active');
}

function isBanned(md, rule) { return md >= rule.start && md <= rule.end; }

function getDirArrow(deg) {
  if (deg == null) return '➔';
  const arrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
  return arrows[Math.round(deg / 45) % 8];
}

function getBarLevel(hr, srH, ssH, wind, gust, rain) {
  if (wind >= 8 || gust >= 12 || rain >= 2) return 'low';
  let dSr = Math.abs(hr - srH); let dSs = Math.abs(hr - ssH);
  if (dSr > 12) dSr = 24 - dSr; if (dSs > 12) dSs = 24 - dSs;
  if (dSr <= 1 || dSs <= 1) return 'high';
  if (dSr <= 3 || dSs <= 3) return 'mid';
  return 'low';
}

async function init() {
  const now = new Date();
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation&daily=sunrise,sunset&past_days=0&forecast_days=2&timezone=${encodeURIComponent(TZ)}&wind_speed_unit=ms`;
    const res = await fetch(url);
    const data = await res.json();
    
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
    const parts = fmt.formatToParts(now);
    const key = `${parts[0].value}-${parts[1].value}-${parts[2].value}T${parts[3].value}:00`;
    let idx = data.hourly.time.indexOf(key);
    if (idx === -1) idx = 0;

    const sunDate = data.hourly.time[idx].slice(0,10);
    const dIdx = data.daily.time.indexOf(sunDate);
    
    const sunriseIso = data.daily.sunrise[dIdx];
    const sunsetIso = data.daily.sunset[dIdx];
    const srH = parseInt(sunriseIso.slice(11,13));
    const ssH = parseInt(sunsetIso.slice(11,13));

    const slots = [];
    for (let i = idx; i < idx + 24 && i < data.hourly.time.length; i++) {
      const timeStr = data.hourly.time[i];
      const dateStr = timeStr.slice(5, 10);
      const hr = parseInt(timeStr.slice(11, 13), 10);
      
      const wind = data.hourly.wind_speed_10m[i] || 0;
      const windDir = data.hourly.wind_direction_10m[i];
      const gust = data.hourly.wind_gusts_10m[i] || 0;
      const rain = data.hourly.precipitation[i] || 0;
      const temp = data.hourly.temperature_2m[i] || 0;
      
      const level = getBarLevel(hr, srH, ssH, wind, gust, rain);
      slots.push({ timeStr, dateStr, hr, wind, windDir, gust, rain, temp, level, sunriseIso, sunsetIso });
    }

    render(slots);
    updateExportBtn();

  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="hero-title bad">НЕТ СВЯЗИ</div>`;
  }
}

function render(slots) {
  const cur = slots[0];
  const mmdd = cur.dateStr;

  document.getElementById('h-date').textContent = cur.dateStr.replace('-', '.');
  document.getElementById('h-wx').textContent = `☁️ ${Math.round(cur.temp)}°`;
  document.getElementById('h-wind').innerHTML = `${getDirArrow(cur.windDir)} ${cur.wind} м/с <span style="font-size:13px" id="h-gust">+${cur.gust}</span>`;

  let peakIdx = slots.findIndex(s => s.level === 'high');

  let actTitle = '', actClass = '', subTime = '';

  if (cur.wind >= 8 || cur.gust >= 12 || cur.rain >= 2) {
    actTitle = 'НЕ ЕХАТЬ'; actClass = 'bad'; subTime = 'Опасный ветер/дождь'; peakIdx = -1; 
  } else if (cur.level === 'high') {
    actTitle = 'КЛЮЁТ СЕЙЧАС'; actClass = 'good'; subTime = 'Сейчас лучшая фаза';
  } else if (peakIdx > 0) {
    actTitle = 'ЖОР'; actClass = 'good';
    const p = slots[peakIdx];
    const startStr = p.sunriseIso.slice(11, 16);
    const endStr = String(parseInt(startStr.slice(0,2)) + 2).padStart(2, '0') + ':' + startStr.slice(3,5);
    subTime = `${startStr} — ${endStr}`;
  } else {
    actTitle = 'СЛАБЫЙ ДЕНЬ'; actClass = 'dim'; subTime = '';
  }

  let targetsHtml = '';
  if (peakIdx !== -1) {
    let list = [];
    const p = slots[peakIdx];
    const isMorning = p.hr >= 4 && p.hr < 12;
    if (isMorning) {
      if (!isBanned(p.dateStr, RULES.pike)) list.push('Щука');
      if (!isBanned(p.dateStr, RULES.grayling)) list.push('Хариус');
      list.push('Окунь');
    } else {
      if (!isBanned(p.dateStr, RULES.pike)) list.push('Щука');
      list.push('Окунь'); list.push('Голавль');
    }
    targetsHtml = list.map(t => `<div class="target-item">${t}</div>`).join('');
  } else {
    targetsHtml = `<div class="target-item" style="color:var(--fg-dim)">Ничего не активно</div>`;
  }

  let graphHtml = '';
  slots.forEach((s, i) => {
    let cls = `graph-bar ${s.level}`;
    if (i === 0) cls += ' now';
    graphHtml += `<div class="${cls}"></div>`;
  });

  let bansList = [];
  if (isBanned(mmdd, RULES.pike)) bansList.push('Щука (до 30.04)');
  if (isBanned(mmdd, RULES.grayling)) bansList.push('Хариус (до 15.05)');
  if (isBanned(mmdd, RULES.asp)) bansList.push('Жерех (до 15.05)');
  if (isBanned(mmdd, RULES.zander)) bansList.push('Судак (до 31.05)');
  if (mmdd >= '01-01' && mmdd <= '04-30') bansList.push('Живец (до 30.04)');

  document.getElementById('legal-info').innerHTML = bansList.length > 0 
    ? `<p>Активные запреты:</p><ul style="margin-left: 20px;">${bansList.map(b => `<li>${b}</li>`).join('')}</ul>`
    : `<p>Сезонных запретов нет.</p>`;

  const html = `
    <div class="hero">
      <div class="hero-title ${actClass}">${actTitle}</div>
      ${subTime ? `<div class="hero-time">${subTime}</div>` : ''}
    </div>
    <div class="targets">${targetsHtml}</div>
    <div class="graph-section">
      <div class="graph-container">${graphHtml}</div>
      <div class="graph-labels">
        <span>Сейчас</span>
        <span>${String((cur.hr + 6) % 24).padStart(2,'0')}:00</span>
        <span>${String((cur.hr + 12) % 24).padStart(2,'0')}:00</span>
        <span>${String((cur.hr + 18) % 24).padStart(2,'0')}:00</span>
      </div>
    </div>
    <button class="diary-trigger" onclick="openDiary()">+ Записать рыбалку</button>
  `;

  document.getElementById('app').innerHTML = html;

  diaryState.context = {
    waterName: "Пруд / Река", 
    temp: Math.round(cur.temp),
    wind: cur.wind,
    gust: cur.gust,
    rain: cur.rain,
    windDir: getDirArrow(cur.windDir),
    phase: (cur.hr >= 4 && cur.hr < 12) ? 'утро' : (cur.hr >= 12 && cur.hr < 18) ? 'день' : 'вечер'
  };
}

function openDiary() {
  const ctx = diaryState.context;
  document.getElementById('d-auto').textContent = `${ctx.waterName} | ${ctx.temp}°C, ветер ${ctx.wind} м/с ${ctx.windDir}, ${ctx.phase}`;
  
  document.getElementById('d-water').value = '';
  document.getElementById('d-depth').value = '';
  document.getElementById('d-gps-btn').classList.remove('ok');
  document.getElementById('d-gps-btn').textContent = '📍 Запомнить точку';
  
  document.querySelectorAll('.d-buttons button').forEach(b => b.classList.remove('on'));
  diaryState.fish = null;
  diaryState.catch = '0';
  diaryState.clarity = null;
  diaryState.level = null;
  diaryState.coords = null;

  document.getElementById('diaryModal').classList.add('active');
}

function closeDiary() {
  document.getElementById('diaryModal').classList.remove('active');
}

function pickBtn(btn, group, val) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  diaryState[group] = val;
}

function getGPS() {
  const btn = document.getElementById('d-gps-btn');
  btn.textContent = 'поиск...';
  navigator.geolocation.getCurrentPosition(pos => {
    diaryState.coords = pos.coords.latitude.toFixed(5) + ',' + pos.coords.longitude.toFixed(5);
    btn.textContent = '✓ ' + diaryState.coords;
    btn.classList.add('ok');
  }, err => {
    btn.textContent = '✗ нет GPS';
    setTimeout(() => { btn.textContent = '📍 Запомнить точку'; }, 2000);
  }, { enableHighAccuracy: true, timeout: 5000 });
}

function saveEntry() {
  const waterTemp = parseFloat(document.getElementById('d-water').value) || null;
  const depth = parseFloat(document.getElementById('d-depth').value) || null;
  
  const entry = {
    ts: new Date().toISOString(),
    context: diaryState.context,
    fish: diaryState.fish,
    catchCount: diaryState.catch,
    clarity: diaryState.clarity,
    level: diaryState.level,
    waterTemp: waterTemp,
    depth: depth,
    coords: diaryState.coords
  };
  
  const diary = JSON.parse(localStorage.getItem('klev_diary') || '[]');
  diary.push(entry);
  localStorage.setItem('klev_diary', JSON.stringify(diary));
  
  closeDiary();
  updateExportBtn();
  alert('✓ Записано. Всего: ' + diary.length);
}

function updateExportBtn() {
  const count = JSON.parse(localStorage.getItem('klev_diary') || '[]').length;
  document.getElementById('d-export-btn').textContent = `↓ Экспорт CSV (${count} записей)`;
}

function exportCSV() {
  const diary = JSON.parse(localStorage.getItem('klev_diary') || '[]');
  if (diary.length === 0) { alert('Дневник пуст'); return; }
  
  const headers = ['Дата', 'Время', 'Вода', 'Воздух', 'Ветер', 'Порыв', 'Дождь', 'Фаза', 'Рыба', 'Улов', 'Прозрачность', 'Уровень', 'Т_воды', 'Глубина', 'GPS'];
  const rows = diary.map(r => {
    const d = new Date(r.ts);
    return [
      d.toLocaleDateString('ru-RU'), d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
      r.context.waterName, r.context.temp, r.context.wind, r.context.gust, r.context.rain, r.context.phase,
      r.fish || '', r.catchCount,
      r.clarity || '', r.level || '',
      r.waterTemp || '', r.depth || '',
      r.coords || ''
    ];
  });
  
  const csv = [headers.join(';')].concat(rows.map(r => r.map(c => `"${c}"`).join(';'))).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'klev_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

init();
</script>
</body>
</html>
