<title>Клёв — Пабраде</title>
<style>
.ft-cmp { display: inline-flex; align-items: flex-start; font-weight: 700; font-size: 16px; line-height: 1; color: var(--ink); }
:root {
  --bg: #faf9f5; --ink: #0a0a0a; --ink-2: #6a6a6a; --ink-3: #9a9a9a;
  --green-mid: #007E45; --gray-mid: #b3b3b3; --line: #ecebe6; --green: #009245;
  --danger: #c1341e;
  --f: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
}
[data-theme="dark"] {
  --bg: #0d0d0d; --ink: #ececec; --ink-2: #a0a0a0; --ink-3: #666;
  --gray-mid: #6a6a6a; --line: #1e1e1e; --green: #4ade80;
  --danger: #e07a62;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--f); font-size: 15px; color: var(--ink); background: var(--bg);
  line-height: 1.4; max-width: 440px; margin: 0 auto; padding: 0 20px 20px; min-height: 100dvh; overflow-x: hidden; }
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; padding: 0; }
a { color: inherit; text-decoration: none; }

.hd { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 18px 12px 16px; min-height: 60px; position: relative; }
.hd::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--line); }
.hd-l { display: flex; align-items: center; justify-self: start; height: 22px; color: var(--ink); }
.hd-l svg { height: 22px; width: auto; display: block; }
.hd-r { display: flex; align-items: center; justify-content: flex-end; gap: 6px; height: 22px;
  font-size: 15px; font-weight: 500; white-space: nowrap; line-height: 22px; justify-self: end; }
.hd-r svg { width: 18px; height: 10px; display: block; flex-shrink: 0; }

.fish-wrap { position: relative; }
.fish-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: 33.333%;
  overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  margin-left: -20px; padding-right: 20px; }
.fish-scroll::-webkit-scrollbar { display: none; }
.fr-c { scroll-snap-align: start; text-align: center; padding: 24px 8px 24px; cursor: pointer; position: relative; min-height: 190px; }
.fr-c + .fr-c::before { content: ''; position: absolute; left: 0; top: 28px; bottom: 28px; width: 1px; background: var(--line); }
.fr-s { display: block; font-size: 48px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.9;
  color: var(--gray-mid); font-variant-numeric: tabular-nums; margin-bottom: 18px; }
.fr-c.great .fr-s { color: var(--green); }
.fr-c.low { opacity: 0.5; }
.fr-c.mid { opacity: 0.7; }
.fr-n { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 11px; }
.fr-t { display: block; font-size: 16px; line-height: 1.4; white-space: nowrap; }
.fr-min { color: var(--ink-3); font-weight: 500; }
.fr-c.great .fr-min { opacity: 0.6; }
.fr-t.main { font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.fr-c.great .fr-t.main { color: var(--green); }
.fr-t.sub { font-weight: 500; color: var(--ink-2); }
.fr-ban { display: block; font-size: 14px; font-weight: 600; color: #D75055; line-height: 1.2; margin-top: 4px; }

.press { padding: 20px 12px 0; }
.press-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px dashed var(--line); font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; gap: 6px; }
.press-header-gpa { font-weight: 700; color: var(--ink); font-size: 15px; flex-shrink: 0; }
.press-header-cat { font-weight: 700; color: var(--ink); font-size: 15px; flex: 1; text-align: center; }
.press-header-cat .lbl { font-weight: 500; color: var(--ink-3); margin-right: 3px; }
.press-header-time { font-weight: 700; color: var(--ink); white-space: nowrap; flex-shrink: 0; font-size: 15px; }
.press-header-time .lbl { font-weight: 500; color: var(--ink-3); margin-right: 3px; }
.press-vals { display: grid; grid-template-columns: auto auto auto auto auto; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 15px; margin-bottom: 8px; }
.press-vals > span { font-weight: 500; color: var(--ink); }
.press-vals > span.past { color: var(--ink-3); font-weight: 500; }
.press-vals > span.current { color: var(--ink); font-weight: 700; }
.press-vals > span.future { color: var(--ink); font-weight: 500; }
.pbar { height: 3px; background: rgba(0,0,0,.1); border-radius: 0; position: relative; margin-bottom: 9px; }
[data-theme="dark"] .pbar { background: rgba(255,255,255,.15); }
.pbar-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--green); border-radius: 0; transition: width .4s ease; }
.pbar-times { display: grid; grid-template-columns: auto auto auto auto auto; justify-content: space-between; font-size: 13px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.pbar-times > span { font-weight: 500; color: var(--ink); }
.pbar-times > span.past { color: var(--ink-3); font-weight: 500; }
.pbar-times > span.current { color: var(--ink); font-weight: 700; }

.chart-svg { width: 100%; height: auto; display: block; }
.chart-wrap { margin-top: 8px; margin-bottom: 0; margin-left: -12px; margin-right: -12px; }
.chart-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 2px 0 20px; margin: 0 -5px; position: relative; }
.cd { text-align: center; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.cd.past { opacity: 0.6; }
.cd.past .cd-date, .cd.past .cd-wx, .cd.past .cd-score { color: var(--gray-mid); }
.cd.future { opacity: 0.55; }
.cd.future.great .cd-score { color: var(--green); }
.cd.today { opacity: 1; }
.cd.today .cd-date { color: var(--green-mid); font-weight: 700; }
.cd.today .cd-wx { opacity: 0.5; }
.cd.today .cd-score { color: var(--ink); font-weight: 700; font-size: 21px; }
.cd-date { font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.cd-score { font-size: 21px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.cd-wx { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--ink); }
.cd-wx svg { width: 12px; height: 12px; }
.day-hd { display: flex; align-items: center; gap: 14px; margin: -8px 0 18px; }
.day-hd-ico { width: 44px; height: 44px; color: var(--ink-2); flex-shrink: 0; }
.day-hd-ico svg { width: 100%; height: 100%; display: block; }
.day-hd-txt { flex: 1; }
.day-hd-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.day-hd-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

.met { display: grid; grid-template-columns: 0.85fr 1fr 1fr 1.15fr; gap: 0; padding: 18px 8px;
  background: rgba(0,0,0,.03); border-radius: 14px; margin: 12px 0 12px 0; }
[data-theme="dark"] .met { background: rgba(255,255,255,.04); }
.met-c { text-align: center; padding: 0 4px; position: relative; display: flex; flex-direction: column; align-items: center; }
.met-c + .met-c::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.met-ico { height: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; color: var(--gray-mid); }
.met-ico svg { display: block; color: var(--gray-mid); }
.met-ico svg * { fill: currentColor; }
.met-v { font-size: 17px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.met-v .unit { font-weight: 500; }
.met-v .min { font-weight: 500; color: var(--ink-2); }
.met-v .min .unit { font-weight: 500; }
.met-l { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-top: 6px; }
.met-l .dir { font-weight: 500; }
.wind-dir-arrow { display: inline-block; width: 13px; height: 13px; margin-right: 3px; vertical-align: -2px; color: var(--ink); }
.wind-dir-arrow svg { width: 100%; height: 100%; display: block; }

.info { padding: 16px 44px 16px 20px; background: rgba(0,0,0,.03); border-radius: 14px; margin: 12px 0;
  font-size: 14px; line-height: 1.3; color: var(--green-mid); position: relative; cursor: pointer; user-select: none; }
[data-theme="dark"] .info { background: rgba(255,255,255,.04); color: rgba(255,255,255,0.6); }
.info .info-bold { color: var(--green-mid); }
.info div { margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info div:last-child { margin-bottom: 0; }
.info.collapsed > div:not(.info-bold):not(.info-keep) { display: none; }
.info.collapsed { padding: 16px 44px 12px 20px; }
.info-toggle { position: absolute; top: 21px; right: 24px; width: 15px; height: 8px;
  color: var(--green-mid); opacity: 0.75; display: block; transition: transform .2s; }
.info.collapsed .info-toggle { transform: rotate(180deg); }
.info-toggle svg { display: block; width: 100%; height: 100%; }
.info.cold { background: rgba(0,0,0,.03); color: var(--ink); }
.info.cold .info-bold { color: var(--ink); }
.info.cold .info-toggle { color: var(--ink-2); }
[data-theme="dark"] .info.cold { background: rgba(255,255,255,.04); }

.rules-banner { display: none; position: relative; padding: 14px 44px 14px 16px; background: #FEEEEF;
  border-radius: 12px; margin-bottom: 8px; font-size: 15px; line-height: 1.4; color: var(--danger); font-weight: 600; }
[data-theme="dark"] .rules-banner { background: rgba(224, 122, 98, 0.15); }
.rules-banner.show { display: block; }
.rules-banner .close-x { position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--danger); cursor: pointer; border-radius: 50%; }

.ft { display: flex; justify-content: center; align-items: center; gap: 40px; padding: 18px 12px 18px;
  margin-top: 18px; position: relative; font-size: 14px; color: var(--ink-2); font-weight: 500; transform: translateX(-5px); }

.info-bold { font-weight: 700; }
.ft a, .ft button { color: var(--ink-3); font: inherit; cursor: pointer; line-height: 1; }

.ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .2s; }
.ov.a { opacity: 1; pointer-events: auto; }
.mc { background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 10px 22px 28px; transform: translateY(20px); transition: transform .2s;
  position: relative; -webkit-overflow-scrolling: touch; }
.ov.a .mc { transform: translateY(0); }
.mh { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 4px auto 16px; }
.mc-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
.mc-sub { display: none; }
.mc-close { position: absolute; top: 12px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.04); font-size: 20px; }
.mc-body { font-size: 14.5px; line-height: 1.6; }
.mc-body h3 { font-size: 17px; font-weight: 800; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.mc-body h3:first-of-type { border-top: none; padding-top: 0; margin-top: 6px; }
.mc-body h4 { font-size: 15px; font-weight: 700; margin: 12px 0 4px; }
.mc-body p { margin-bottom: 6px; }
.mc-body .row { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.mc-body .row:last-child { border-bottom: none; }
.mc-body .row .k { color: var(--ink-3); font-weight: 500; }
.mc-body .row .v { font-weight: 500; }
.mc-body .ban-row .k, .mc-body .ban-row .v { color: #D75055; font-weight: 600; }

.species-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 4px; }
.species-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px;
  border-radius: 8px; background: rgba(0,0,0,.04); font-size: 14px; font-weight: 600; transition: background .15s, color .15s; }
[data-theme="dark"] .species-btn { background: rgba(255,255,255,.06); }
.species-btn .chk-wrap { display: none; line-height: 0; }
.species-btn.sel .chk-wrap { display: inline-block; }

.catch-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.catch-btn { padding: 20px 12px; border-radius: 12px; font-size: 16px; font-weight: 700; transition: transform .1s, opacity .15s; }
.catch-btn:active { transform: scale(0.97); }
.catch-btn.yes { background: var(--green); color: #fff; }
.catch-btn.no { background: rgba(0,0,0,.06); color: var(--ink); }
[data-theme="dark"] .catch-btn.no { background: rgba(255,255,255,.08); }

.bucket-row { display: grid; grid-template-columns: 72px 1fr 78px; gap: 10px; padding: 10px 0; align-items: center;
  border-bottom: 1px solid var(--line); font-size: 13.5px; }
.bucket-bar { height: 8px; background: rgba(0,0,0,.06); border-radius: 4px; overflow: hidden; position: relative; }
[data-theme="dark"] .bucket-bar { background: rgba(255,255,255,.08); }
.bucket-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--green); border-radius: 4px; }
.bucket-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bucket-val .pct { color: var(--green-mid); }
.bucket-val .frac { color: var(--ink-3); font-size: 12px; font-weight: 500; }

.journal-row { display: grid; grid-template-columns: 90px 1fr 40px 30px; gap: 8px; padding: 8px 0; font-size: 13px;
  border-bottom: 1px solid var(--line); align-items: center; }
.journal-row .j-date { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12px; }
.journal-row .j-sp { font-weight: 600; }
.journal-row .j-score { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.journal-row .j-res { text-align: right; font-weight: 700; }
.journal-row .j-res.yes { color: var(--green); }
.journal-row .j-res.no { color: var(--ink-3); }

.toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%) translateY(-10px);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600;
  z-index: 2000; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
  max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.ld { padding: 80px 20px; text-align: center; color: var(--ink-3); font-size: 14px; }
.sp { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%;
  animation: sp .7s linear infinite; margin: 0 auto 12px; }
@keyframes sp { to { transform: rotate(360deg) } }
.err { padding: 14px; background: rgba(0,0,0,.04); color: var(--ink-2); border-radius: 10px; font-size: 14px; margin: 20px 0; line-height: 1.5; }

.fish-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 4px 0 14px;
}
.fish-dots .fd {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--line);
  transition: background .2s;
}
.fish-dots .fd.active { background: var(--ink); }
.press-vals,
.pbar-times {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
  font-variant-numeric: tabular-nums;
}
.press-vals > span:nth-child(1),
.pbar-times > span:nth-child(1) { text-align: left; }
.press-vals > span:nth-child(2),
.pbar-times > span:nth-child(2),
.press-vals > span:nth-child(3),
.pbar-times > span:nth-child(3),
.press-vals > span:nth-child(4),
.pbar-times > span:nth-child(4) { text-align: center; }
.press-vals > span:nth-child(5),
.pbar-times > span:nth-child(5) { text-align: right; }

.press-vals { font-size: 15px; margin-bottom: 8px; }
.pbar-times { font-size: 13px; margin-bottom: 4px; }
.press-vals > span:nth-child(2),
.pbar-times > span:nth-child(2) { transform: translateX(-7px); }
.press-vals > span:nth-child(4),
.pbar-times > span:nth-child(4) { transform: translateX(7px); }
</style>
</head>
<body>

<header class="hd">
  <div class="hd-l" id="hdLogo"></div>
  <div class="hd-m" id="hdLoc"></div>
  <div class="hd-r" id="hdR"></div>
</header>

<main id="app">
  <div class="ld"><div class="sp"></div>Загрузка</div>
</main>

<div class="ov" id="ov">
  <div class="mc">
    <div class="mh"></div>
    <button class="mc-close" id="mcClose">×</button>
    <div class="mc-title" id="mcTitle"></div>
    <div class="mc-sub" id="mcSub"></div>
    <div class="mc-body" id="mcBody"></div>
  </div>
</div>

<script>
'use strict';

var LAT = 54.9827, LON = 25.7671;
var TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Vilnius';

var SPECIES = {
  perch:   { name: 'Окунь',   waterOpt: [12, 20], w: { pr: 0.25, wt: 0.20, wn: 0.20, wd: 0.10, cl: 0.15, rn: 0.10 },
    season: 'круглый год · пик май–июль' },
  pike:    { name: 'Щука',    waterOpt: [10, 18], w: { pr: 0.30, wt: 0.25, wn: 0.15, wd: 0.10, cl: 0.10, rn: 0.10 },
    season: 'май · сентябрь–ноябрь' },
  roach:   { name: 'Плотва',  waterOpt: [12, 22], w: { pr: 0.25, wt: 0.20, wn: 0.15, wd: 0.10, cl: 0.15, rn: 0.15 },
    season: 'апрель–май · сентябрь–октябрь' },
  chub:    { name: 'Голавль', waterOpt: [14, 22], w: { pr: 0.25, wt: 0.20, wn: 0.20, wd: 0.10, cl: 0.15, rn: 0.10 },

}

function renderChart(pSlice, dark, todayIdx) {
  var W = 340, H = 110, padSide = 20, padTop = 28, chartH = 55;
  var n = pSlice.length;
  var stepX = n > 1 ? (W - padSide * 2) / (n - 1) : 0;
  var vals = [];
  pSlice.forEach(function(d) { if (d.pMean != null) vals.push(d.pMean); });
  var pMin = vals.length ? Math.min.apply(null, vals) : 990;
  var pMax = vals.length ? Math.max.apply(null, vals) : 1010;
  var range = pMax - pMin; if (range < 4) range = 4;
  pMin = pMin - range * 0.2; pMax = pMax + range * 0.2;
  var fullRange = pMax - pMin;
  var pts = pSlice.map(function(d, i) {
    if (d.pMean == null) return null;
    var x = padSide + i * stepX;
    var y = padTop + (1 - (d.pMean - pMin) / fullRange) * chartH;
    return { x: x, y: y, val: d.pMean };
  });
  var lineColor = dark ? '#a0a0a0' : '#4a4a4a';
var dotFill = dark ? '#ffffff' : '#4a4a4a';
  var todayColor = dark ? '#4ade80' : '#009245';
  var dotStroke = dark ? '#0d0d0d' : '#faf9f5';
  var gridColor = dark ? '#2a2a2a' : '#d8d4ca';
  var valueColor = dark ? '#7a7a7a' : '#999';
  var grid = '', dots = '', labels = '';
  pts.forEach(function(pt, i) {
    if (!pt) return;
    var isToday = (i === todayIdx);
    grid += '<line x1="' + pt.x.toFixed(1) + '" y1="' + pt.y.toFixed(1) + '" x2="' + pt.x.toFixed(1) + '" y2="' + (H - 4) + '" stroke="' + (isToday ? todayColor : gridColor) + '" stroke-width="' + (isToday ? '1.2' : '0.6') + '" stroke-dasharray="2 3"/>';
    labels += '<text x="' + pt.x.toFixed(1) + '" y="' + (pt.y - 9).toFixed(1) + '" font-size="10" font-weight="' + (isToday ? '700' : '500') + '" fill="' + (isToday ? (dark ? '#ececec' : '#0a0a0a') : valueColor) + '" text-anchor="middle">' + Math.round(pt.val) + '</text>';
  });
  var pathD = '', started = false;
  pts.forEach(function(pt) { if (!pt) { started = false; return; } if (!started) { pathD += 'M' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1); started = true; } else { pathD += 'L' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1); } });
  pts.forEach(function(pt, i) {
    if (!pt) return;
    var isToday = (i === todayIdx);
    dots += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="' + (isToday ? 5.5 : 4.5) + '" fill="' + (isToday ? todayColor : dotFill) + '" stroke="' + dotStroke + '" stroke-width="3"/>';
  });
  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + grid +
    (pathD ? '<path d="' + pathD + '" fill="none" stroke="' + lineColor + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>' : '') + dots + labels + '</svg>';
}

function weatherDesc(code) {
  if (code === 0) return 'Ясно';

  if (code === 3) return 'Пасмурно';
  if (code === 45 || code === 48) return 'Туман';
  if (code >= 51 && code <= 57) return 'Морось';
  if (code >= 61 && code <= 67) return 'Дождь';
  if (code >= 71 && code <= 77) return 'Снег';
  if (code >= 80 && code <= 82) return 'Ливень';
  if (code >= 95) return 'Гроза';
  return 'Облачно';
}

function oppositeShore(deg) { var dirs = ['северного','северо-восточного','восточного','юго-восточного','южного','юго-западного','западного','северо-западного']; return dirs[Math.round(deg / 45) % 8]; }

function dayDetailHTML(p, di) {

function bindJournalHandlers() {
  var grid = document.getElementById('catchSpecies');

    btn.addEventListener('click', function() {

function render(p) {

  document.getElementById('hdR').innerHTML = svgSunrise(sunCol) + '<span>' + fmtSunTime(today.sunrise) + '-' + fmtSunTime(today.sunset) + '</span>';

  var firstHr = null;
  for (var fi = 0; fi < hourlyByDay[tIdx].length; fi++) { if (hourlyByDay[tIdx][fi]) { firstHr = hourlyByDay[tIdx][fi]; break; } }
  var curWater = firstHr ? Math.round(firstHr.waterTemp) : 15;
  var scores = {};
  ORDER.forEach(function(k) { scores[k] = dayScore(hourlyByDay[tIdx], k, today.srH, today.ssH); });
  var nowParts = getNowParts();

  var dp = num(curHr.pressureDelta, 0), dpA = Math.abs(dp);

  var windEval = curHr.windSpeed < 1 ? 'Штиль — нужна тонкая снасть' : curHr.windSpeed < 3 ? 'Слабый — рябь, рыба смелее' : curHr.windSpeed <= 6 ? 'Оптимальный для ловли' : curHr.windSpeed <= 9 ? 'Умеренный — лови у берега' : 'Сильный — рыба на глубине';
  var cc = today.cMean != null ? Math.round(today.cMean) : '—';

  });
  var orderKeys = ORDER.slice().sort(function(a, b) { return scores[b] - scores[a]; });

    }

  else if (dpA < 1 && curHr.windSpeed >= 3 && curHr.windSpeed <= 6) verdict = 'Стабильно — рыба активна';

  var infoLines = [];

  infoLines.push('Вода ' + curWater + '° — ' + waterNote);
  var selNameGen = { perch: 'окуня', pike: 'щуки', roach: 'плотвы', chub: 'голавля', bream: 'леща', crucian: 'карася' }[selected] || 'рыбы';

    if (typeof t === 'string') html += '<div>' + t + '</div>';
    else if (t.bold) html += '<div class="info-bold">' + t.text + '</div>';
    else if (t.keep) html += '<div class="info-keep">' + t.text + '</div>';
    else html += '<div>' + t.text + '</div>';
  });
  html += '<span class="info-toggle" id="infoToggle"><svg viewBox="0 0 18 11" xmlns="http://www.w3.org/2000/svg"><path d="M2 9 L9 2 L16 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  html += '</div>';

  html += '<footer class="ft">';
  html += '<button id="btnJournal">Улов</button>';
  html += '<button id="btnLessons">Справка</button>';
  html += '<a href="https://alisas.lt" target="_blank">Alis.lt</a>';
  html += '</footer>';

  document.getElementById('app').innerHTML = html;

  document.querySelectorAll('.fr-c').forEach(function(el) {
    el.addEventListener('click', function() {
      var k = this.getAttribute('data-sp');
      state.selected = k;
      if (navigator.vibrate) navigator.vibrate(6);
      render(p);
      var s = SPECIES[k]; var sc = scores[k];
      openModal(s.name, s.season, speciesInfoHTML(k, s, sc));
    });
  });

  document.querySelectorAll('.cd').forEach(function(el) {
    el.addEventListener('click', function() {
      var di = parseInt(this.getAttribute('data-di'), 10);
      var dd = new Date(p.days[di].date + 'T12:00:00');
      openModal(RU_DOW[dd.getDay()] + ' ' + dd.getDate(), '', dayDetailHTML(p, di));
    });
  });

  document.getElementById('btnLessons').addEventListener('click', function() {
    openModal('Справка', 'Как читать погоду и ловить рыбу', lessonsHTML());
  });

  document.getElementById('btnJournal').addEventListener('click', function() {
    openJournalModal();
  });

  var infoBlock = document.getElementById('infoBlock');
  if (infoBlock) {
    infoBlock.addEventListener('click', function() {
      var isCollapsed = this.classList.toggle('collapsed');
      try { localStorage.setItem('klew_info_collapsed', isCollapsed ? '1' : '0'); } catch(e) {}
    });
  }

  var closeBtn = document.getElementById('rulesClose');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      document.getElementById('rulesBanner').classList.remove('show');
    });
  }

  var scrollEl = document.querySelector('.fish-scroll');
  var dots = document.querySelectorAll('#fishDots .fd');
  if (scrollEl && dots.length) {
    scrollEl.addEventListener('scroll', function() {
      var w = scrollEl.scrollWidth - scrollEl.clientWidth;
      var pct = w > 0 ? scrollEl.scrollLeft / w : 0;
      var idx = Math.round(pct * (dots.length - 1));
      dots.forEach(function(d, i) { d.classList.toggle('active', i === idx); });
    }, { passive: true });
  }
}

document.getElementById('mcClose').addEventListener('click', closeModal);
document.getElementById('ov').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

try {
  var cnt = parseInt(localStorage.getItem('klew_launches') || '0', 10);
  state.launchCount = cnt + 1;
  localStorage.setItem('klew_launches', String(state.launchCount));
} catch(e) { state.launchCount = 1; }

fetchT(buildUrl()).then(function(json) {
  state.data = processData(json);
  render(state.data);
  setInterval(function() { if (state.data) render(state.data); }, 5 * 60 * 1000);
}).catch(function(e) {
  console.error(e);
  document.getElementById('app').innerHTML = '<div class="err">Не удалось загрузить: ' + (e.message || e) + '<br><br>Проверь интернет и обнови страницу</div>';
});
</script>
</body>
</html>
